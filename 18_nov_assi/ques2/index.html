<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1  class=" head">Student Validation Form</h1>
        <div class="user">Name :
            <input type="text" placeholder="userame" class="use" id="name">
            <small id="nameError" class="error"></small>
        </div>
        <div class="email">email :
            <input type="text" placeholder="Email" class="mail" id="email">
            <small id="emailError" class="error"></small>
        </div>
        <div class="phone">Phone :
            <input type="text" placeholder="phone" class="ph" id="phone">
            <small id="phoneError" class="error"></small>
        </div>
        <div class="pass">Password :
            <input type="password" placeholder="Password" class="lock" id="password">
            <small id="passError" class="error"></small>
        </div>
        <button class="button" id="submitbtn">Submit</button>
        </div>
        
        <script src="app.js"></script>
</body>
</html>
